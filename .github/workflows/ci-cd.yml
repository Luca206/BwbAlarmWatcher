name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Format check
        run: dotnet format --verify-no-changes

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Check for vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -E "^\s+> " vulnerable.txt

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish linux-arm64 single file
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet publish src/BwbAlarmWatcher -c Release -r linux-arm64 --self-contained \
            -p:PublishTrimmed=true -p:PublishSingleFile=true -p:Version="$VERSION" \
            -o publish

      - name: Package release archive
        run: |
          mkdir package
          cp publish/BwbAlarmWatcher publish/appsettings.json package/
          cp deploy/bwbAlarmWatcher.service deploy/bwbAlarmWatcher.env.example deploy/update.sh package/
          tar -czf bwbAlarmWatcher-linux-arm64.tar.gz -C package .

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" bwbAlarmWatcher-linux-arm64.tar.gz \
            --title "$GITHUB_REF_NAME" --generate-notes
